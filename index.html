<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZBieranie 💰</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, #063b25 0%, transparent 35%),
        linear-gradient(135deg, #020807, #07140f 50%, #020807);
}

/* NAGŁÓWEK */

header {
    text-align: center;
    padding: 55px 20px 35px;
}

.logo {
    font-size: 60px;
    margin-bottom: 5px;
    filter: drop-shadow(0 0 18px #22ff88);
}

header h1 {
    margin: 0;
    font-size: 48px;
    color: #7dffb2;
    text-shadow:
        0 0 8px #22ff88,
        0 0 25px #22ff88;
}

header p {
    color: #9fb8aa;
    font-size: 18px;
}

/* GŁÓWNY KONTENER */

.container {
    width: min(950px, 92%);
    margin: auto;
}

/* KARTY */

.card {
    position: relative;
    overflow: hidden;
    background: rgba(7, 22, 15, 0.88);
    border: 1px solid rgba(45, 255, 135, 0.16);
    border-radius: 28px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow:
        0 15px 50px rgba(0,0,0,.35),
        inset 0 0 30px rgba(30,255,130,.025);
}

.card h2 {
    color: #a8ffc7;
}

/* SALDO */

.balance-box {
    text-align: center;
    padding: 10px 0 5px;
}

.balance-label {
    color: #8fa99c;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.balance {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    margin: 8px 0 18px;
}

.dollar {
    font-size: 55px;
    color: #48ff91;
    text-shadow:
        0 0 8px #22ff70,
        0 0 25px #22ff70,
        0 0 45px rgba(34,255,112,.7);
}

.money {
    font-size: 62px;
    font-weight: 900;
    color: #8dffb5;
    text-shadow:
        0 0 8px #22ff70,
        0 0 25px #22ff70,
        0 0 50px rgba(34,255,112,.6);
}

/* PASEK POSTĘPU */

.progress-wrap {
    margin-top: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #a5b8ae;
    margin-bottom: 10px;
}

.progress-bg {
    position: relative;
    height: 58px;
    border-radius: 30px;
    overflow: hidden;
    background: #07120d;
    border: 2px solid #153e2a;
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.8);
}

.progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    border-radius: 30px;
    overflow: hidden;
    background: linear-gradient(
        90deg,
        #087b3d,
        #18bd62,
        #35f47e
    );
    transition: width 1.5s cubic-bezier(.2,.8,.2,1);
}

/* RUCHOME ZAKRZYWIONE PASKI */

.progress-fill::before {
    content: "";
    position: absolute;
    inset: -30px;
    width: 220%;
    background:
        repeating-linear-gradient(
            105deg,
            transparent 0px,
            transparent 25px,
            rgba(2,80,38,.55) 26px,
            rgba(2,80,38,.55) 42px,
            transparent 43px,
            transparent 70px
        );
    animation: moveStripes 2.4s linear infinite;
    transform: skewX(-8deg);
}

.progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.10),
        transparent
    );
    animation: shine 3s linear infinite;
}

@keyframes moveStripes {
    from {
        transform: translateX(0) skewX(-8deg);
    }
    to {
        transform: translateX(-90px) skewX(-8deg);
    }
}

@keyframes shine {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(100%);
    }
}

.progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 5;
    text-shadow: 0 2px 5px #000;
}

/* STATYSTYKI */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    padding: 22px;
    text-align: center;
    border-radius: 20px;
    background: rgba(2,12,8,.7);
    border: 1px solid #123d27;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
    color: #6cff9e;
}

.stat-name {
    margin-top: 6px;
    color: #82998d;
}

/* PRZYCISKI */

button {
    border: none;
    border-radius: 14px;
    padding: 13px 20px;
    margin: 5px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #159447;
    box-shadow: 0 0 15px rgba(21,148,71,.3);
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(34,255,112,.5);
}

.red {
    background: #b52d3b;
    box-shadow: 0 0 15px rgba(255,45,60,.3);
}

.red:hover {
    box-shadow: 0 0 25px rgba(255,45,60,.5);
}

/* HISTORIA */

.history-item {
    padding: 13px;
    margin: 7px 0;
    border-radius: 12px;
    background: #07140e;
    border-left: 4px solid #24d66c;
}

.expense {
    border-left-color: #ff3d4d;
    color: #ff9ba3;
}

/* STOPKA */

footer {
    text-align: center;
    padding: 40px;
    color: #53665c;
}

/* TELEFON */

@media(max-width:650px) {

    header h1 {
        font-size: 38px;
    }

    .money {
        font-size: 42px;
    }

    .dollar {
        font-size: 40px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🧴</div>
    <h1>ZBieranie</h1>
    <p>Każda złotówka przybliża nas do celu.</p>
</header>

<div class="container">

    <!-- SALDO -->

    <div class="card">
        <div class="balance-box">

            <div class="balance-label">
                Aktualne saldo
            </div>

            <div class="balance">
                <div class="dollar">$</div>
                <div class="money" id="money">0,00 zł</div>
            </div>

            <div class="progress-wrap">

                <div class="progress-info">
                    <span>Postęp do celu</span>
                    <span>6868 zł</span>
                </div>

                <div class="progress-bg">

                    <div class="progress-fill" id="progress">
                    </div>

                    <div class="progress-text" id="percent">
                        0%
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- STATYSTYKI -->

    <div class="card">

        <h2>📊 Statystyki</h2>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="bottles">0</div>
                <div class="stat-name">🧴 Butelek</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="days">0</div>
                <div class="stat-name">📅 Dni</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="remaining">6868 zł</div>
                <div class="stat-name">🎯 Brakuje</div>
            </div>

        </div>

    </div>

    <!-- DODAWANIE PIENIĘDZY -->

    <div class="card">

        <h2>💰 Dodaj pieniądze</h2>

        <p>
            Nie musisz zbierać tylko butelek.
            Możesz dodawać dowolne zarobione pieniądze.
